name: ff-django-poc
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set-in-env}
      POSTGRES_USER: ${POSTGRES_USER:?set-in-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set-in-env}
      DJANGO_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_db
      - web_net
    restart: unless-stopped
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      - web
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - web_net
    restart: unless-stopped
volumes:
  pgdata:
networks:
  private_db:
    internal: true
  web_net: {}
