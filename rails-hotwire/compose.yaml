name: ff-rails-poc
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set-in-env}
      POSTGRES_USER: ${POSTGRES_USER:?set-in-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: ${RAILS_SECRET_KEY_BASE:?set-in-env}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_db
      - web_net
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - web_net
    restart: unless-stopped
volumes:
  pgdata:
networks:
  private_db:
    internal: true
  web_net: {}
